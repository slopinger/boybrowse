name: Nix
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Linux protocol checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e
        with:
          extra-conf: |
            sandbox = true
            substituters = https://cache.nixos.org https://cache.kyouma.net
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cache.kyouma.net:Frjwu4q1rnwE/MnSTmX9yx86GNA/z3p/oElGvucLiZg=
      - name: Build tests with Nix
        run: nix build .#checks.x86_64-linux.server .#checks.x86_64-linux.javascript .#checks.x86_64-linux.integration .#checks.x86_64-linux.tooling -L --no-link
  macos:
    name: macOS ARM64 source build
    runs-on: macos-26
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reclaim disposable runner storage
        shell: bash
        run: |
          df -h /
          selected_xcode="$(xcode-select -p | cut -d/ -f1-3)"
          for app in /Applications/Xcode*.app; do
            if [ "$app" != "$selected_xcode" ]; then sudo rm -rf "$app"; fi
          done
          sudo rm -rf /Library/Developer/CoreSimulator /Users/runner/Library/Developer/CoreSimulator
          # Runner services write into the user cache while it is removed; it is only best-effort space.
          sudo rm -rf /Users/runner/Library/Caches || true
          df -h /
      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e
        with:
          extra-conf: |
            sandbox = true
            max-jobs = 1
            cores = 3
      - name: Check build headroom
        shell: bash
        run: |
          available_kib="$(df -k /nix | awk 'NR==2 {print $4}')"
          if [ "$available_kib" -lt 104857600 ]; then
            echo "::error::Chromium requires at least 100 GiB available. This runner has insufficient disk after cleanup."
            exit 1
          fi
      - name: Build protocol tests with Nix
        run: nix build .#checks.aarch64-darwin.server .#checks.aarch64-darwin.javascript .#checks.aarch64-darwin.integration .#checks.aarch64-darwin.tooling -L --no-link
      - name: Build the native browser with Nix
        run: nix build .#packages.aarch64-darwin.default -L --out-link result --keep-failed
      - name: Diagnose a stalled GN configuration outside the sandbox
        if: failure()
        shell: bash
        run: |
          set +e
          dir="$(sudo ls -dt /nix/var/nix/builds/nix-*/ | head -1)"
          echo "kept build directory: $dir"
          sudo ls "$dir" | head -20
          sudo bash -c '
            set -a
            cd "$1"
            . ./env-vars 2>/dev/null
            cd src
            export PATH="$PATH:/bin:/usr/bin:/usr/sbin"
            gn --version
            # The last build file gn opens before it spins identifies the looping script.
            fs_usage -w -f pathname gn > /tmp/gn-fs.log 2>&1 &
            sleep 2
            # script(1) gives gn a pty, so its output is line-buffered and survives being killed.
            (timeout 90 script -q /tmp/gn-outside.log gn gen --verbose --time out/Release --args="$2" > /dev/null 2>&1; echo "gn exit: $?" >> /tmp/gn-outside.log) &
            sleep 45
            gn_pid="$(pgrep -x gn | head -1)"
            echo "--- gn $gn_pid after 45s"
            ps -o pid,etime,%cpu,rss -p "$gn_pid"
            sample "$gn_pid" 3 -file /tmp/sample-gn.txt > /dev/null 2>&1
            echo "--- gn call graph"
            sed -n "/^Call graph:/,/^Total number/p" /tmp/sample-gn.txt | sed -E "s/ *\[0x[0-9a-f]+\]//; s/\(in gn\)//" | cut -c1-170 | head -150
            sleep 50
            pkill fs_usage
            echo "--- last build files gn opened"
            grep -E "open|stat" /tmp/gn-fs.log | grep -E "\.gni?( |$)" | tail -25 | cut -c1-230
            echo "--- gn log"
            tail -20 /tmp/gn-outside.log
          ' _ "$dir" 'is_debug=false is_official_build=false is_component_build=false symbol_level=0 blink_symbol_level=0 v8_symbol_level=0 target_cpu="arm64" target_os="mac" use_system_xcode=false is_chrome_branded=false chrome_pgo_phase=0 use_remoteexec=false use_siso=false enable_nacl=false enable_widevine=false use_typescript_go=false devtools_use_typescript_go=false treat_warnings_as_errors=false use_lld=true use_clang_modules=false use_unified_system_module=false'
      - name: Smoke test the built browser
        run: nix build .#checks.aarch64-darwin.runtime -L --no-link
      - name: Export Nix closure
        run: |
          nix-store --export $(nix-store -qR "$(readlink result)") > boybrowse-macos-arm64.nar
          shasum -a 256 boybrowse-macos-arm64.nar > boybrowse-macos-arm64.nar.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boybrowse-macos-arm64-preview
          path: |
            boybrowse-macos-arm64.nar
            boybrowse-macos-arm64.nar.sha256
          retention-days: 14
